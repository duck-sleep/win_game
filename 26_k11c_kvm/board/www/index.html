<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K11C KVM</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #111417; color: #e8eaed; font: 15px/1.4 system-ui, sans-serif; }
  #vid { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: none; cursor: crosshair; background: #000; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
  button { flex: 1 1 auto; min-width: 56px; min-height: 44px; padding: 0 8px; font-size: 15px;
           background: #2a2f36; color: #e8eaed; border: 1px solid #3c434c; border-radius: 8px; }
  button:active { background: #45607a; }
  #txt { flex: 1 1 140px; min-height: 44px; padding: 0 10px; font-size: 16px;
         background: #1b1f24; color: #e8eaed; border: 1px solid #3c434c; border-radius: 8px; }
  label.chk { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #9aa0a6; }
  #st { padding: 6px 10px; font-size: 12px; color: #9aa0a6; font-family: ui-monospace, monospace;
        border-top: 1px solid #262b31; white-space: pre-wrap; }
  #st.bad { color: #ff6b6b; }
</style>
</head>
<body>
<div id="surface"></div>

<div class="row">
  <button data-click="1">左键</button>
  <button data-click="2">右键</button>
  <button data-dbl="1">双击</button>
  <button data-wheel="3">滚上</button>
  <button data-wheel="-3">滚下</button>
</div>

<div class="row">
  <input id="txt" type="text" autocomplete="off" placeholder="输入要发过去的文字">
  <button id="send">发送</button>
  <label class="chk"><input id="cr" type="checkbox">发送后回车</label>
</div>

<div class="row">
  <button data-key="40">Enter</button>
  <button data-key="42">退格</button>
  <button data-key="41">Esc</button>
  <button data-key="43">Tab</button>
  <button data-key="80">&larr;</button>
  <button data-key="82">&uarr;</button>
  <button data-key="79">&rarr;</button>
  <button data-key="81">&darr;</button>
</div>

<div class="row">
  <button data-combo="8,0">Win</button>
  <button data-combo="1,44">切输入法</button>
  <button data-combo="5,76">Ctrl+Alt+Del</button>
</div>

<div class="row">
  <button id="ab">测延迟 DC vs HTTP</button>
  <span id="about" style="align-self:center;font-size:12px;color:#9aa0a6"></span>
</div>

<div id="st">连接中…</div>

<script>
var MAX = 32767, seq = 0, cur = { x: 16384, y: 16384 };
var st = document.getElementById('st');
var THROTTLE = 30, lastSent = 0, pending = null, timer = null;

/* 画面有两种：默认 WebRTC(H.265 硬解)；地址带 ?mjpeg=1 退回旧的 <img> 软编路径。
   坐标换算只认 getBoundingClientRect()，两种元素共用同一套触摸代码。 */
var MJPEG = /[?&]mjpeg=1/.test(location.search);
var vid = document.createElement(MJPEG ? 'img' : 'video');
vid.id = 'vid';
if (MJPEG) { vid.src = '/stream.mjpg'; vid.alt = '被控电脑画面'; }
else { vid.autoplay = true; vid.muted = true; vid.playsInline = true; }
document.getElementById('surface').appendChild(vid);

/* 状态行分开存：fps/clients 由 /state 轮询更新，ms/err 由每次 RPC 更新。
   早先只有一行文本、轮询时整行重画，把"上次 RPC xx ms"盖掉了。 */
var net = { fps: '-', clients: '-', ms: '-', best: '-', err: '',
            codec: '-', vf: '-', drop: '-', jb: '-', tx: 'HTTP' };

function render() {
  var head = MJPEG
    ? net.fps + ' fps | ' + net.clients + ' 看流'
    : (net.codec === '-' ? '连视频中' : net.codec + ' ' + net.vf + ' fps') +
      ' | 丢帧 ' + net.drop + ' | 缓冲 ' + net.jb + ' ms';
  st.textContent = head + ' | 鼠标 ' + net.tx + ' | 上次 RPC ' + net.ms +
    ' ms | 最快 ' + net.best + ' ms' + (net.err ? ' | ' + net.err : '');
  st.className = net.err ? 'bad' : '';
}

function rpc(method, params) {
  var t0 = performance.now();
  return rpcSend({ id: ++seq, method: method, params: params || {} }).then(function (j) {
    if (j.error) { throw new Error(j.error.message); }
    var ms = Math.round(performance.now() - t0);
    net.ms = ms;
    if (net.best === '-' || ms < net.best) { net.best = ms; }
    net.err = '';
    render();
    return j.result;
  }).catch(function (e) {
    net.err = 'RPC 失败: ' + e.message;
    render();
    throw e;
  });
}

/* ---------- 控制走 WebRTC datachannel（照 JetKVM 的通道划分） ----------
   hid            可靠有序：键盘、鼠标按键（按下/松开不能丢，丢了按键会卡在按下）
   hid-unreliable 不可靠  ：鼠标移动（旧的没有价值，重传只会让最新位置更晚到）
   jsonrpc        可靠有序：其余 JSON-RPC（滚轮、打字、查询）
   报文格式和 JetKVM 逐字节一致：0x03 + x(int32 BE) + y(int32 BE) + buttons(u8)。
   任何一条通道没开就退回 HTTP fetch —— 换传输不许把功能弄挂。 */
var dcHid = null, dcFast = null, dcRPC = null;
var dcSent = 0, fastSent = 0, httpSent = 0, rpcPending = {};

function pointerMsg(x, y, buttons) {
  var b = new Uint8Array(10);
  b[0] = 0x03;
  b[1] = (x >> 24) & 255; b[2] = (x >> 16) & 255; b[3] = (x >> 8) & 255; b[4] = x & 255;
  b[5] = (y >> 24) & 255; b[6] = (y >> 16) & 255; b[7] = (y >> 8) & 255; b[8] = y & 255;
  b[9] = buttons;
  return b;
}

function sendPointer(x, y, buttons) {
  /* 纯移动走不可靠通道；带按键的（按下/松开）走可靠通道 */
  var ch = buttons === 0 ? (dcFast && dcFast.readyState === 'open' ? dcFast : dcHid) : dcHid;
  if (ch && ch.readyState === 'open') {
    try {
      ch.send(pointerMsg(x, y, buttons));
      if (ch === dcFast) { fastSent++; } else { dcSent++; }
      net.tx = 'DC';
      return;
    } catch (e) {}
  }
  httpSent++;
  net.tx = 'HTTP';
  rpc('absMouseReport', { x: x, y: y, buttons: buttons }).catch(function () {});
}

function rpcSend(obj, forceHTTP) {
  if (!forceHTTP && dcRPC && dcRPC.readyState === 'open') {
    return new Promise(function (resolve, reject) {
      var id = obj.id;
      rpcPending[id] = resolve;
      /* 没有超时就会永远悬着：通道半断时 Promise 不会自己失败 */
      setTimeout(function () {
        if (rpcPending[id]) { delete rpcPending[id]; reject(new Error('datachannel 超时')); }
      }, 5000);
      try { dcRPC.send(JSON.stringify(obj)); }
      catch (e) { delete rpcPending[id]; reject(e); }
    });
  }
  return fetch('/rpc', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj)
  }).then(function (r) { return r.json(); });
}

/* ---------- 触摸板：手指在画面上移动 = 绝对鼠标 ---------- */
function rel(e) {
  var r = vid.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y));
  return { x: Math.round(x * MAX), y: Math.round(y * MAX) };
}

function sendMove(p) {
  lastSent = performance.now();
  sendPointer(p.x, p.y, 0);
}

function onMove(e) {
  var p = rel(e);
  cur = p;
  var wait = THROTTLE - (performance.now() - lastSent);
  if (wait <= 0) {
    pending = null;
    sendMove(p);
  } else {
    pending = p;
    if (!timer) {
      timer = setTimeout(function () {
        timer = null;
        if (pending) { sendMove(pending); pending = null; }
      }, wait);
    }
  }
}

function clickAt(btn) {
  /* 带按键的报文走可靠通道（sendPointer 里分好），HTTP 那边靠 Promise 链保序 */
  if (dcHid && dcHid.readyState === 'open') {
    sendPointer(cur.x, cur.y, btn);
    sendPointer(cur.x, cur.y, 0);
    return;
  }
  rpc('absMouseReport', { x: cur.x, y: cur.y, buttons: btn })
    .then(function () { return rpc('absMouseReport', { x: cur.x, y: cur.y, buttons: 0 }); })
    .catch(function () {});
}

var down = null;
vid.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  down = { t: Date.now(), x: e.clientX, y: e.clientY, moved: 0 };
  try { vid.setPointerCapture(e.pointerId); } catch (err) {}
});
vid.addEventListener('pointermove', function (e) {
  if (!down) { return; }
  e.preventDefault();
  down.moved = Math.max(down.moved, Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y));
  onMove(e);
});
vid.addEventListener('pointerup', function (e) {
  if (!down) { return; }
  var dt = Date.now() - down.t;
  onMove(e);
  if (down.moved < 10 && dt < 300) { clickAt(1); }   /* 轻点 = 左键单击 */
  down = null;
});
vid.addEventListener('pointercancel', function () { down = null; });

/* ---------- 按钮 ---------- */
document.querySelectorAll('[data-click]').forEach(function (b) {
  b.addEventListener('click', function () { clickAt(+b.dataset.click); });
});
document.querySelectorAll('[data-dbl]').forEach(function (b) {
  b.addEventListener('click', function () { clickAt(1); setTimeout(function () { clickAt(1); }, 120); });
});
document.querySelectorAll('[data-wheel]').forEach(function (b) {
  b.addEventListener('click', function () { rpc('wheelReport', { y: +b.dataset.wheel, x: 0 }); });
});
document.querySelectorAll('[data-key]').forEach(function (b) {
  b.addEventListener('click', function () { rpc('keyCombo', { modifiers: 0, key: +b.dataset.key }); });
});
document.querySelectorAll('[data-combo]').forEach(function (b) {
  b.addEventListener('click', function () {
    var m = b.dataset.combo.split(',');
    rpc('keyCombo', { modifiers: +m[0], key: +m[1] });
  });
});

/* ---------- 打字：用 input 事件取值，不靠 keydown（安卓软键盘 keyCode 全是 229） ---------- */
var txt = document.getElementById('txt');
document.getElementById('send').addEventListener('click', function () {
  var s = txt.value;
  if (!s) { return; }
  rpc('typeText', { text: s }).then(function (r) {
    if (r && r.skipped) { net.err = '跳过 ' + r.skipped + ' 个不支持的字符'; render(); }
    txt.value = '';
    if (document.getElementById('cr').checked) {
      return rpc('keyCombo', { modifiers: 0, key: 40 });
    }
  }).catch(function () {});
});

/* ---------- WebRTC 视频：信令在板子的 Go 网关 :8001，局域网不用 STUN ---------- */
var GW = 'http://' + location.hostname + ':8001';
var pc = null, sess = 0, statsTimer = 0;

function gatherDone(p) {
  return new Promise(function (res) {
    if (p.iceGatheringState === 'complete') { res(); return; }
    var t = setTimeout(res, 2000);   // 非 trickle：等候选收集完再发 answer，2 秒兜底
    p.onicegatheringstatechange = function () {
      if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); }
    };
  });
}

function bad(r) {
  return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t.trim()); });
}

function retryVideo(msg) {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = 0; }
  sess++;                       // 旧 pc 的回调就此作废，免得 close() 又触发一次重连
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  net.err = msg + '，2 秒后重连';
  render();
  setTimeout(connectVideo, 2000);
}

function readStats() {
  pc.getStats().then(function (s) {
    var inb = null, codecs = {};
    s.forEach(function (x) {
      if (x.type === 'inbound-rtp' && x.kind === 'video') { inb = x; }
      if (x.type === 'codec') { codecs[x.id] = x; }
    });
    if (!inb) { return; }
    var mine = (codecs[inb.codecId] || {}).mimeType || '?';
    net.codec = mine.replace('video/', '');
    net.vf = inb.framesPerSecond;
    net.drop = inb.framesDropped;
    net.jb = inb.jitterBufferEmittedCount
      ? (1000 * inb.jitterBufferDelay / inb.jitterBufferEmittedCount).toFixed(1) : '-';
    render();
    var line = ['codec=' + mine, 'size=' + inb.frameWidth + 'x' + inb.frameHeight,
                'fps=' + inb.framesPerSecond, 'dropped=' + inb.framesDropped,
                'lost=' + inb.packetsLost, 'jb_ms=' + net.jb].join(' ');
    fetch(GW + '/stats', { method: 'POST', body: line }).catch(function () {});
  }).catch(function () {});
}

function connectVideo() {
  if (MJPEG) { return; }
  var my = ++sess;
  dcHid = dcFast = dcRPC = null;
  rpcPending = {};
  net.tx = 'HTTP';
  pc = new RTCPeerConnection();
  pc.ontrack = function (e) {
    if (my !== sess) { return; }
    vid.srcObject = e.streams[0] || new MediaStream([e.track]);
    try { e.receiver.jitterBufferTarget = 0; } catch (err) {}
  };
  pc.ondatachannel = function (e) {
    if (my !== sess) { return; }
    var ch = e.channel;
    ch.binaryType = 'arraybuffer';
    if (ch.label === 'hid') { dcHid = ch; }
    else if (ch.label === 'hid-unreliable') { dcFast = ch; }
    else if (ch.label === 'jsonrpc') {
      dcRPC = ch;
      ch.onmessage = function (ev) {
        /* 服务端发文本帧；万一哪天变回二进制帧，这里不静默吞掉，否则 Promise 只能等到超时 */
        var txt = typeof ev.data === 'string' ? ev.data
          : (ev.data instanceof ArrayBuffer ? new TextDecoder('utf-8').decode(ev.data) : null);
        if (txt === null) { return; }
        var obj;
        try { obj = JSON.parse(txt); } catch (err) { return; }
        var cb = rpcPending[obj.id];
        if (cb) { delete rpcPending[obj.id]; cb(obj); }
      };
    }
    ch.onopen = function () { if (dcHid || dcRPC) { net.tx = 'DC'; render(); } };
    ch.onclose = function () { net.tx = 'HTTP'; render(); };
  };
  pc.onconnectionstatechange = function () {
    if (my !== sess) { return; }
    if (pc.connectionState === 'connected') {
      if (net.err) { net.err = ''; render(); }
      if (!statsTimer) { readStats(); statsTimer = setInterval(readStats, 2000); }
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
      retryVideo('WebRTC ' + pc.connectionState);
    }
  };
  fetch(GW + '/offer')
    .then(function (r) { return r.ok ? r.text() : bad(r); })
    .then(function (sdp) {
      return pc.setRemoteDescription({ type: 'offer', sdp: sdp })
        .then(function () { return pc.createAnswer(); })
        .then(function (ans) { return pc.setLocalDescription(ans); });
    })
    .then(function () { return gatherDone(pc); })
    .then(function () {
      return fetch(GW + '/answer', { method: 'POST', body: pc.localDescription.sdp });
    })
    .then(function (r) { return r.ok ? r.text() : bad(r); })
    .catch(function (e) { if (my === sess) { retryVideo('视频连不上: ' + e.message); } });
}

/* ---------- 一键 A/B：同一条链路上比 datachannel 和 HTTP 的往返 ----------
   交替发（环境漂移对两边一样）+ 取中位数（抗尾巴）。 */
function median(a) {
  var s = a.slice().sort(function (x, y) { return x - y; });
  return s.length ? s[Math.floor(s.length / 2)] : '-';
}

document.getElementById('ab').addEventListener('click', function () {
  var el = document.getElementById('about'), dcMs = [], hMs = [], i = 0;
  el.textContent = '测中…';
  function step() {
    if (i++ >= 30) {
      el.textContent = 'DC 中位 ' + median(dcMs) + ' ms｜HTTP 中位 ' + median(hMs) +
        ' ms｜各 ' + dcMs.length + ' 次';
      return;
    }
    var useHTTP = (i % 2 === 0);
    var t0 = performance.now();
    rpcSend({ id: ++seq, method: 'ping', params: {} }, useHTTP).then(function () {
      var ms = Math.round(performance.now() - t0);
      (useHTTP ? hMs : dcMs).push(ms);
      setTimeout(step, 60);
    }).catch(function () { setTimeout(step, 60); });
  }
  step();
});

/* ---------- 状态行：每 2 秒问一次 /state ---------- */
function poll() {
  fetch('/state').then(function (r) { return r.json(); }).then(function (s) {
    net.fps = s.fps;
    net.clients = s.clients;
    render();
  }).catch(function (e) {
    net.err = '连不上板子: ' + e.message;
    render();
  });
}
setInterval(poll, 2000);
render();
poll();
connectVideo();
</script>
</body>
</html>
